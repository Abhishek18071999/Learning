services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./DevAtlas.Api
    environment:
      - ConnectionStrings__Default=Host=db;Database=devatlas
      - Redis__Connection=redis:6379
    depends_on: [db, redis]
    ports: ["8080:8080"]

  worker:
    build: ./DevAtlas.Api
    command: ["dotnet", "DevAtlas.Api.dll", "--worker"]
    environment:
      - ConnectionStrings__Default=Host=db;Database=devatlas
      - Redis__Connection=redis:6379
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
